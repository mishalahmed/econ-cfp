name: CFP reminders

on:
  schedule:
    - cron: "0 5 * * *"   # 08:00 in UTC+3, every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the notices without posting them"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send reminders
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 reminders.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save reminder state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notified.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update reminder state"
          git pull --rebase origin main
          git push origin HEAD:main
